limit_req_zone $binary_remote_addr zone=it2_sessions:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=it2_actions:10m rate=30r/m;

upstream it2_aim {
    server 127.0.0.1:39080;
    keepalive 16;
}

upstream it2_gateway {
    server 127.0.0.1:39081;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name interactivetraining.ai www.interactivetraining.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /root/interactivetraining/cert;
        default_type text/plain;
    }

    location / {
        return 301 https://interactivetraining.ai$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.interactivetraining.ai;

    ssl_certificate /root/.getssl/interactivetraining.ai/interactivetraining.ai.chained.crt;
    ssl_certificate_key /root/.getssl/interactivetraining.ai/interactivetraining.ai.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://interactivetraining.ai$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name interactivetraining.ai;

    ssl_certificate /root/.getssl/interactivetraining.ai/interactivetraining.ai.chained.crt;
    ssl_certificate_key /root/.getssl/interactivetraining.ai/interactivetraining.ai.key;
    ssl_session_cache shared:SSL_it2:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' wss://interactivetraining.ai; frame-src https://www.youtube.com; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 8k;
    client_body_timeout 10s;
    client_header_timeout 5s;
    keepalive_timeout 30s;

    location ^~ /.well-known/acme-challenge/ {
        root /root/interactivetraining/cert;
        default_type text/plain;
    }

    location = /api/demo/live {
        limit_req zone=it2_sessions burst=2 nodelay;
        proxy_pass http://it2_gateway;
        include /etc/nginx/proxy_params;
    }

    location /api/demo/ {
        limit_req zone=it2_actions burst=20 nodelay;
        proxy_pass http://it2_gateway;
        include /etc/nginx/proxy_params;
    }

    location = / {
        root /srv/interactive-training/current/demo/deploy/research;
        try_files /index.html =404;
        default_type text/html;
    }

    location = /live {
        proxy_pass http://it2_aim;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<link rel="canonical" href="https://interactivetraining.ai/live"><meta property="og:url" content="https://interactivetraining.ai/live"></head>';
        sub_filter_once on;
    }

    location = /robots.txt {
        alias /srv/interactive-training/current/demo/deploy/research/robots.txt;
        default_type text/plain;
    }

    location = /sitemap.xml {
        alias /srv/interactive-training/current/demo/deploy/research/sitemap.xml;
        default_type application/xml;
    }

    location = /healthz {
        proxy_pass http://it2_gateway;
        include /etc/nginx/proxy_params;
    }

    location = /_it2_authorize_action {
        internal;
        proxy_pass http://it2_gateway/api/demo/authorize-action;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    location ~ "^/api/live/[^/]+/actions$" {
        limit_req zone=it2_actions burst=20 nodelay;
        auth_request /_it2_authorize_action;
        proxy_pass http://it2_aim;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://it2_aim;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    access_log /var/log/nginx/interactivetraining-access.log;
    error_log /var/log/nginx/interactivetraining-error.log info;
}
